<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kanji Drawing Practice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            future: {
                hoverOnlyWhenSupported: true,
            }
        }
    </script>
    <style>
        body {
            touch-action: none;
            overscroll-behavior: none;
        }

        canvas {
            touch-action: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            background-image:
                linear-gradient(to right, #f0f0f0 1px, transparent 1px),
                linear-gradient(to bottom, #f0f0f0 1px, transparent 1px),
                linear-gradient(to right, #e0e0e0 2px, transparent 2px),
                linear-gradient(to bottom, #e0e0e0 2px, transparent 2px);
            background-size: 50% 50%, 50% 50%, 100% 100%, 100% 100%;
            background-position: center center;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .animate-shake {
            animation: shake 0.3s ease-in-out;
        }
    </style>
</head>

<body class="bg-gray-100 h-[100dvh] min-h-[100dvh] w-screen flex flex-col items-center py-2 md:py-8 font-sans overflow-hidden">

    <!-- Main View -->
    <div id="main-view" class="w-full max-w-md px-4 flex flex-col items-center h-full">
        <!-- Main Mode Toggle Bar -->
        <div class="flex bg-white rounded-xl p-1 mb-4 w-full text-xs font-bold uppercase tracking-wider text-gray-500 shadow-sm">
            <button id="main-mode-kanji" class="flex-1 py-2.5 text-center rounded-lg transition-all focus:outline-none cursor-pointer">Kanji</button>
            <button id="main-mode-vocab" class="flex-1 py-2.5 text-center rounded-lg transition-all focus:outline-none cursor-pointer">Vocabulary</button>
        </div>

        <!-- Header / Prompt -->
        <div class="bg-white rounded-2xl pt-3 pb-3 px-4 mb-4 w-full flex flex-col relative">
            <div class="flex justify-between items-center w-full mb-3">
                <div class="w-20"></div> <!-- Spacer for center balance -->
                <h1 class="text-sm text-gray-500 uppercase tracking-wider font-bold text-center">Draw the Kanji for:
                </h1>
                <div class="flex items-center -mr-2">
                    <button id="mute-btn"
                        class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-full transition-colors flex-shrink-0">
                    </button>
                    <button id="settings-btn"
                        class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-full transition-colors flex-shrink-0">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z">
                            </path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="min-h-[104px] flex flex-col justify-center items-center w-full">
                <h2 id="prompt-meaning" class="text-3xl font-extrabold text-indigo-600 text-center w-full transition-opacity duration-500">Loading...
                </h2>
            </div>
        </div>

        <!-- Canvas Container -->
        <div class="relative w-full aspect-square bg-white rounded-xl mb-6">
            <canvas id="draw-canvas" class="w-full h-full rounded-xl cursor-crosshair"></canvas>

            <!-- Canvas Overlay for Completed Vocabulary Word -->
            <div id="vocab-canvas-overlay" class="absolute inset-0 flex flex-col items-center justify-center bg-white/95 rounded-xl opacity-0 pointer-events-none transition-opacity duration-500 z-10">
                <div id="vocab-overlay-word" class="text-emerald-600 font-extrabold text-5xl pb-4"></div>
                <div id="vocab-overlay-meaning" class="text-sm text-gray-500 font-medium px-6 text-center"></div>
            </div>

            <!-- Hidden SVG for Path Resampling -->
            <svg id="svg-helper" style="display:none;">
                <path id="svg-path" d="" />
            </svg>
        </div>

        <!-- Vocabulary Text Input Area -->
        <div id="vocab-input-div" class="hidden w-full bg-white rounded-xl shadow-sm p-6 mb-6 flex flex-col items-center">
            <input type="text" id="vocab-input" autocomplete="off" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 outline-none text-center text-lg font-bold text-gray-800 focus:border-indigo-500 transition-colors" placeholder="Type the English meaning">
            <button id="vocab-check-btn" class="mt-4 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl transition-all shadow-md focus:outline-none">
                Check Answer
            </button>
        </div>

        <!-- Progress / Controls -->
        <div class="flex justify-between items-center w-full">
            <div id="progress-text" class="text-gray-500 font-medium">Stroke 1 / X</div>
            <button id="teach-btn"
                class="ml-auto px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-lg text-gray-700 font-medium transition-colors">
                Teach Me
            </button>
        </div>

        <div id="message-area"
            class="mt-4 text-red-500 font-bold h-6 transition-opacity duration-300 opacity-0 text-center">
            Message Area
        </div>
    </div>

    <!-- Settings View -->
    <div id="settings-view" class="w-full max-w-md px-4 flex flex-col hidden h-full max-h-screen overflow-hidden pb-8">
        <div class="flex justify-between items-center mb-4 mt-2">
            <h2 id="settings-title" class="text-2xl font-bold text-gray-800">Select Kanji</h2>
            <div id="search-container" class="hidden flex-1 items-center bg-gray-200 rounded-full px-3 py-1.5 mr-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="text-gray-500 mr-2 flex-shrink-0">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="search-input" class="bg-transparent outline-none w-full text-gray-700"
                    placeholder="Search...">
            </div>
            <div class="flex items-center space-x-2">
                <button id="daily-study-btn"
                    class="px-3 py-1.5 bg-indigo-600 text-white text-xs font-bold rounded-full hover:bg-indigo-700 transition-colors shadow-sm flex-shrink-0">
                    DAILY STUDY
                </button>
                <button id="search-toggle-btn"
                    class="p-2 bg-gray-200 text-gray-700 rounded-full hover:bg-gray-300 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
                <button id="close-settings-btn"
                    class="p-2 bg-gray-200 text-gray-700 rounded-full hover:bg-gray-300 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>
        <!-- Settings Toggle Bar -->
        <div class="flex bg-gray-200 p-1 rounded-xl mb-4 text-xs font-bold uppercase tracking-wider text-gray-500">
            <button id="settings-mode-kanji" class="flex-1 py-2 text-center rounded-lg transition-all focus:outline-none cursor-pointer">Kanji</button>
            <button id="settings-mode-vocab" class="flex-1 py-2 text-center rounded-lg transition-all focus:outline-none cursor-pointer">Vocab</button>
        </div>
        <div id="kanji-list-container" class="flex-1 overflow-y-scroll bg-white rounded-xl shadow-sm p-4 space-y-4">
            <!-- Dynamically populated -->
        </div>
    </div>

    <!-- Kanji Info View -->
    <div id="info-view" class="fixed inset-0 bg-gray-100 flex flex-col items-center z-50 hidden overflow-hidden">
        <div class="w-full max-w-md px-4 flex flex-col h-full pb-8">
            <div class="flex justify-between items-end mb-2 mt-4 md:mt-12 px-2">
                <h2 id="info-kanji" class="text-7xl font-black text-gray-800 leading-none"></h2>
                <button id="close-info-btn"
                    class="p-2 bg-gray-200 text-gray-700 rounded-full hover:bg-gray-300 transition-colors shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div id="info-view-body"
                class="flex-1 bg-white rounded-2xl pt-2 pb-6 px-6 shadow-sm flex flex-col items-center space-y-8 overflow-y-auto">
                <div id="info-canvas-parent"
                    class="relative w-64 h-64 bg-gray-50 rounded-2xl border-2 border-gray-200 shadow-inner flex items-center justify-center overflow-hidden flex-shrink-0">
                    <canvas id="info-canvas" class="w-full h-full"></canvas>
                </div>

                <div class="w-full">
                    <h3 class="text-xs text-gray-400 uppercase tracking-widest font-bold mb-3">Meaning</h3>
                    <div id="info-meaning" class="flex flex-wrap gap-2"></div>
                </div>

                <div id="info-readings-wrapper" class="w-full">
                    <h3 class="text-xs text-gray-400 uppercase tracking-widest font-bold mb-3">Readings</h3>
                    <div id="info-readings" class="flex flex-wrap gap-2"></div>
                </div>

                <div id="info-related-words-wrapper" class="w-full hidden">
                    <h3 class="text-xs text-gray-400 uppercase tracking-widest font-bold mb-3">Related Vocabulary</h3>
                    <div class="space-y-4">
                        <div>
                            <h4 class="text-xs text-indigo-600 font-bold mb-1">Familiar</h4>
                            <div id="info-familiar-words" class="flex flex-wrap gap-2"></div>
                        </div>
                        <div>
                            <h4 class="text-xs text-gray-400 font-bold mb-1">Unfamiliar</h4>
                            <div id="info-unfamiliar-words" class="flex flex-wrap gap-2"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- MOBILE DEBUG CONSOLE ---
        (function() {
            const isDebugParam = new URLSearchParams(window.location.search).has('debug');
            if (!isDebugParam) return;

            // Create debug container
            const container = document.createElement('div');
            container.id = 'mobile-debug-log';
            container.style.cssText = 'position:fixed;bottom:0;left:0;right:0;height:180px;background:rgba(17,24,39,0.95);color:#10B981;font-family:monospace;font-size:10px;z-index:99999;border-top:2px solid #374151;display:flex;flex-direction:column;pointer-events:auto;user-select:text;';

            const header = document.createElement('div');
            header.style.cssText = 'background:#1F2937;padding:4px 8px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #374151;font-weight:bold;color:#F3F4F6;';
            header.innerHTML = '<span>Debug Log</span>';

            const buttonContainer = document.createElement('div');
            buttonContainer.style.cssText = 'display:flex;gap:8px;';

            const clearBtn = document.createElement('button');
            clearBtn.textContent = 'Clear';
            clearBtn.style.cssText = 'background:#374151;color:#F3F4F6;border:none;padding:2px 6px;border-radius:3px;cursor:pointer;font-size:9px;';
            clearBtn.onclick = () => { logArea.innerHTML = ''; };

            const copyBtn = document.createElement('button');
            copyBtn.textContent = 'Copy';
            copyBtn.style.cssText = 'background:#374151;color:#F3F4F6;border:none;padding:2px 6px;border-radius:3px;cursor:pointer;font-size:9px;';
            copyBtn.onclick = () => {
                const logs = Array.from(logArea.childNodes).map(node => node.textContent).join('\n');
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(logs).then(() => {
                        copyBtn.textContent = 'Copied!';
                        setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1000);
                    }).catch(() => {
                        fallbackCopy(logs);
                    });
                } else {
                    fallbackCopy(logs);
                }
            };

            function fallbackCopy(text) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    copyBtn.textContent = 'Copied!';
                    setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1000);
                } catch (err) {
                    alert('Copy failed: ' + err);
                }
                document.body.removeChild(textarea);
            }

            const closeBtn = document.createElement('button');
            closeBtn.textContent = 'Hide';
            closeBtn.style.cssText = 'background:#374151;color:#F3F4F6;border:none;padding:2px 6px;border-radius:3px;cursor:pointer;font-size:9px;';
            closeBtn.onclick = () => { container.style.display = 'none'; };

            buttonContainer.appendChild(clearBtn);
            buttonContainer.appendChild(copyBtn);
            buttonContainer.appendChild(closeBtn);
            header.appendChild(buttonContainer);

            const logArea = document.createElement('div');
            logArea.style.cssText = 'flex:1;overflow-y:auto;padding:8px;white-space:pre-wrap;word-break:break-all;';

            container.appendChild(header);
            container.appendChild(logArea);
            document.body.appendChild(container);

            function appendLog(type, args) {
                const message = Array.from(args).map(arg => {
                    if (arg && (arg instanceof Error || (typeof arg === 'object' && 'message' in arg && 'stack' in arg))) {
                        return (arg.name || 'Error') + ": " + arg.message + "\n" + arg.stack;
                    }
                    if (typeof arg === 'object' && arg !== null) {
                        try { return JSON.stringify(arg); } catch (e) { return String(arg); }
                    }
                    return String(arg);
                }).join(' ');
                
                const logItem = document.createElement('div');
                logItem.style.borderBottom = '1px solid #1F2937';
                logItem.style.padding = '2px 0';
                
                const time = new Date().toTimeString().split(' ')[0];
                const prefix = `[${time}] [${type}] `;
                
                if (type === 'ERROR') {
                    logItem.style.color = '#EF4444';
                } else if (type === 'WARN') {
                    logItem.style.color = '#F59E0B';
                }
                
                logItem.textContent = prefix + message;
                logArea.appendChild(logItem);
                logArea.scrollTop = logArea.scrollHeight;
            }

            // Override console
            const _log = console.log;
            const _warn = console.warn;
            const _error = console.error;

            console.log = function() {
                _log.apply(console, arguments);
                appendLog('LOG', arguments);
            };
            console.warn = function() {
                _warn.apply(console, arguments);
                appendLog('WARN', arguments);
            };
            console.error = function() {
                _error.apply(console, arguments);
                appendLog('ERROR', arguments);
            };

            // Uncaught exceptions
            window.onerror = function(message, source, lineno, colno, error) {
                appendLog('ERROR', [`Uncaught Exception: ${message} at ${source}:${lineno}:${colno}`, error]);
                return false;
            };

            // Unhandled promise rejections
            window.addEventListener('unhandledrejection', function(event) {
                appendLog('ERROR', ['Unhandled Rejection:', event.reason]);
            });

            // Log diagnostic info on startup
            setTimeout(() => {
                console.log("Device Diagnostics:");
                console.log("User Agent:", navigator.userAgent);
                console.log("Pointer Events Support:", 'PointerEvent' in window);
                console.log("Touch Events Support:", 'TouchEvent' in window);
                console.log("Max Touch Points:", navigator.maxTouchPoints);
                const rect = canvas.getBoundingClientRect();
                console.log("Canvas width x height:", canvas.width, "x", canvas.height);
                console.log("Canvas ClientRect:", rect.width, "x", rect.height, "left:", rect.left, "top:", rect.top);
                console.log("Window Device Pixel Ratio:", window.devicePixelRatio);
            }, 1000);
        })();

        // --- STATE & DATA ---
        let KANJI_DATABASE = [];
        let userSelectedKanji = new Set();
        let kanjiIntervals = {};
        let kanjiDomElements = {};
        let vocabDomElements = {};
        let isMuted = false;

        let studyMode = 'kanji'; // 'kanji' or 'vocab'
        let VOCAB_DATABASE = [];
        let userSelectedVocab = new Set();
        let vocabIntervals = {};
        let vocabReviewQueue = [];
        let currentVocabData = null;
        let currentVocabCharIdx = 0;
        let vocabReviewMode = 'ja_to_en'; // 'ja_to_en' or 'en_to_ja'
        const MIN_INTERVAL_FOR_VOCAB = 8;

        // --- COMPOSITE SCORING THRESHOLDS (TUNABLE) ---
        const NUM_POINTS = 50;
        const MIN_SCALE = 0.8;

        const THRESHOLDS = {
            stroke1: {
                directionDeg: 35,
                rmsBase: 25
            },
            subsequent: {
                directionDeg: 30,
                rmsBase: 18,
                lengthMin: 0.6,
                lengthMax: 1.5,
                lengthBufferPx: 30
            }
        };

        const MIN_DISTANCE = 4;

        // --- LOCAL STORAGE CHECK ---
        let storageAvailable = false;
        try {
            const testKey = '__storage_test__';
            window.localStorage.setItem(testKey, testKey);
            window.localStorage.removeItem(testKey);
            storageAvailable = true;
        } catch (e) {
            console.warn("Local storage unavailable (sandboxed/private mode). Settings will not persist.");
            storageAvailable = false;
        }

        let reviewQueue = [];
        let currentKanjiData = null;
        let expectedStrokes = [];
        let currentStrokeIdx = 0;
        let deckNeedsReinit = false;

        let frameScale = 1;
        let frameOffsetX = 0;
        let frameOffsetY = 0;

        let completedStrokes = [];
        let activeStroke = [];
        let activeMorphs = [];
        let failCount = 0;

        let usedHintForKanji = false;
        let teachMode = false;
        let vocabWordPassed = true;
        let isSuccessAnimating = false;
        let isCharFadingOut = false;
        let charFadeOutStartTime = 0;
        let confettiParticles = [];
        let finalScale = 1;
        let finalOffsetX = 0;
        let finalOffsetY = 0;
        let successStartTime = 0;

        let isDrawing = false;
        let isShaking = false;
        let shakeOffset = 0;
        let strokeColor = "#374151";

        // --- DOM Elements ---
        const mainView = document.getElementById('main-view');
        const settingsView = document.getElementById('settings-view');
        const infoView = document.getElementById('info-view');
        const canvas = document.getElementById('draw-canvas');
        const ctx = canvas.getContext('2d');
        const infoCanvas = document.getElementById('info-canvas');
        const infoCtx = infoCanvas.getContext('2d');
        const svgPathEl = document.getElementById('svg-path');
        const promptMeaning = document.getElementById('prompt-meaning');
        const progressText = document.getElementById('progress-text');
        const teachBtn = document.getElementById('teach-btn');
        const messageArea = document.getElementById('message-area');

        // --- AUDIO ---
        let audioCtx;

        function updateMuteUI() {
            const muteBtn = document.getElementById('mute-btn');
            if (isMuted) {
                muteBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2V15H6L11 19V5Z"></path><line x1="22" y1="9" x2="16" y2="15"></line><line x1="16" y1="9" x2="22" y2="15"></line></svg>`;
            } else {
                muteBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>`;
            }
        }

        function playErrorBeep() {
            if (isMuted) return;
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'triangle';
            oscillator.frequency.setValueAtTime(200, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.2);
        }

        function playSuccessChime() {
            if (isMuted) return;
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.3);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.5);
        }

        function playPartyPopper() {
            if (isMuted) return;
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);

            const bufferSize = audioCtx.sampleRate * 0.5;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'lowpass';
            noiseFilter.frequency.value = 5000;
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.6, audioCtx.currentTime);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

            noise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            noise.start();
        }

        // --- INIT & SIZING ---
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            canvas.style.width = `${rect.width}px`;
            canvas.style.height = `${rect.height}px`;
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
        });

        function parseSVG(svgText) {
            const svgStartIndex = svgText.indexOf('<svg');
            let cleanedSvgText = svgStartIndex !== -1 ? svgText.substring(svgStartIndex) : svgText;
            
            // If the svg tag is missing the kvg namespace declaration (because it was defined in the stripped DOCTYPE), inject it.
            if (!cleanedSvgText.includes('xmlns:kvg')) {
                cleanedSvgText = cleanedSvgText.replace('<svg', '<svg xmlns:kvg="http://kanjivg.tagaini.net"');
            }
            
            const parser = new DOMParser();
            const doc = parser.parseFromString(cleanedSvgText, "image/svg+xml");
            const errNode = doc.querySelector("parsererror");
            if (errNode) {
                throw new Error("SVG Parse Error: " + errNode.textContent);
            }
            return doc;
        }

        // --- MATH & HEURISTICS ---
        function getPointsFromSvgPath(d, numPoints) {
            svgPathEl.setAttribute('d', d);
            const length = svgPathEl.getTotalLength();
            const points = [];
            for (let i = 0; i < numPoints; i++) {
                const pt = svgPathEl.getPointAtLength((i / (numPoints - 1)) * length);
                points.push({ x: pt.x, y: pt.y });
            }
            return points;
        }

        function getPointsFromStroke(strokePoints, numPoints) {
            if (strokePoints.length === 0) return [];
            if (strokePoints.length === 1) return Array(numPoints).fill({ ...strokePoints[0] });

            let totalLength = 0;
            const distances = [0];
            for (let i = 1; i < strokePoints.length; i++) {
                const dx = strokePoints[i].x - strokePoints[i - 1].x;
                const dy = strokePoints[i].y - strokePoints[i - 1].y;
                totalLength += Math.sqrt(dx * dx + dy * dy);
                distances.push(totalLength);
            }

            const points = [];
            for (let i = 0; i < numPoints; i++) {
                const targetDist = (i / (numPoints - 1)) * totalLength;
                let idx = 1;
                while (idx < distances.length && distances[idx] < targetDist) idx++;
                if (idx >= distances.length) {
                    points.push({ ...strokePoints[strokePoints.length - 1] });
                    continue;
                }
                const prevDist = distances[idx - 1];
                const segmentLength = distances[idx] - prevDist;
                const t = segmentLength === 0 ? 0 : (targetDist - prevDist) / segmentLength;
                points.push({
                    x: strokePoints[idx - 1].x + (strokePoints[idx].x - strokePoints[idx - 1].x) * t,
                    y: strokePoints[idx - 1].y + (strokePoints[idx].y - strokePoints[idx - 1].y) * t
                });
            }
            return points;
        }

        function getBoundingBox(points) {
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            points.forEach(p => {
                if (p.x < minX) minX = p.x;
                if (p.y < minY) minY = p.y;
                if (p.x > maxX) maxX = p.x;
                if (p.y > maxY) maxY = p.y;
            });
            return { minX, minY, maxX, maxY, width: maxX - minX, height: maxY - minY };
        }

        function getStrokeLength(pts) {
            let len = 0;
            for (let i = 1; i < pts.length; i++) {
                len += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
            }
            return len;
        }

        function getStrokeAngle(pts) {
            return Math.atan2(pts[pts.length - 1].y - pts[0].y, pts[pts.length - 1].x - pts[0].x);
        }

        function getAngleDiffDeg(a1, a2) {
            let diff = Math.abs(a1 - a2) % (Math.PI * 2);
            if (diff > Math.PI) diff = Math.PI * 2 - diff;
            return diff * (180 / Math.PI);
        }

        function calculateRMSDistance(pts1, pts2) {
            let sumSq1 = 0;
            for (let i = 0; i < pts1.length; i++) {
                let minDSq = Infinity;
                for (let j = 0; j < pts2.length; j++) {
                    const dx = pts1[i].x - pts2[j].x;
                    const dy = pts1[i].y - pts2[j].y;
                    const dSq = dx * dx + dy * dy;
                    if (dSq < minDSq) minDSq = dSq;
                }
                sumSq1 += minDSq;
            }
            let rms1 = sumSq1 / pts1.length;

            let sumSq2 = 0;
            for (let i = 0; i < pts2.length; i++) {
                let minDSq = Infinity;
                for (let j = 0; j < pts1.length; j++) {
                    const dx = pts2[i].x - pts1[j].x;
                    const dy = pts2[i].y - pts1[j].y;
                    const dSq = dx * dx + dy * dy;
                    if (dSq < minDSq) minDSq = dSq;
                }
                sumSq2 += minDSq;
            }
            let rms2 = sumSq2 / pts2.length;

            return Math.sqrt((rms1 + rms2) / 2);
        }

        // --- QUEUE & SETTINGS LOGIC ---
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        const getMasteryPercent = (interval) => {
            if (!interval) return 0;
            const MIN_DISTANCE = 4;
            const MAX_DISTANCE = 512;
            const levelsAchieved = Math.log2(interval / MIN_DISTANCE);
            const maxLevels = Math.log2(MAX_DISTANCE / MIN_DISTANCE);
            let percent = (levelsAchieved / maxLevels) * 100;
            return Math.max(0, Math.min(100, percent));
        };

        const getMasteryColor = (percent) => {
            if (percent < 50) {
                const hue = (percent / 50) * 60;
                return `hsl(${hue}, 100%, 45%)`;
            } else {
                const hue = 60 + ((percent - 50) / 50) * 60;
                return `hsl(${hue}, 100%, 40%)`;
            }
        };

        // --- SPACED REPETITION LOGIC (SRS) ---
        function recordKanjiResult(kanjiChar, passed, isFromVocabMode = false) {
            if (!kanjiIntervals[kanjiChar]) {
                kanjiIntervals[kanjiChar] = MIN_DISTANCE;
            }

            if (!passed) {
                // Missed: decrease interval to repeat sooner (softer penalty in vocab mode)
                const penalty = isFromVocabMode ? 0.7 : 0.3;
                kanjiIntervals[kanjiChar] = Math.max(MIN_DISTANCE, Math.floor(kanjiIntervals[kanjiChar] * penalty));
            } else {
                // Perfect: increase interval to push it further out
                kanjiIntervals[kanjiChar] = Math.floor(kanjiIntervals[kanjiChar] * 2.0);
            }

            if (storageAvailable) {
                localStorage.setItem('kanjiIntervalsPrefs', JSON.stringify(kanjiIntervals));
            }

            // Splice it back into the queue based on its new interval
            // If interval is larger than queue length, it naturally defaults to the front of the queue (0)
            if (userSelectedKanji.has(kanjiChar)) {
                let insertDist = kanjiIntervals[kanjiChar];
                let spliceIndex = Math.max(0, reviewQueue.length - insertDist);
                reviewQueue.splice(spliceIndex, 0, kanjiChar);
            }
        }

                // Fetch kanji data

                console.log("initApp: kanji.csv status =", kanjiResponse.status);
                if (!kanjiResponse.ok) throw new Error("Failed to fetch kanji.csv");
                const kanjiText = await kanjiResponse.text();
                parseKanjiCSV(kanjiText);
                console.log("initApp: Parsed KANJI_DATABASE size =", KANJI_DATABASE.length, ", userSelectedKanji size =", userSelectedKanji.size);

                // Fetch vocab data

                if (!vocabResponse.ok) throw new Error("Failed to fetch vocab.csv");
                const vocabText = await vocabResponse.text();
                parseVocabCSV(vocabText);
                console.log("initApp: Parsed VOCAB_DATABASE size =", VOCAB_DATABASE.length);

                // Recalculate implicit vocabulary selection based on loaded kanji selections
                recalculateVocabSelection();
                updateStudyModeUI();

                // Load initial review card based on mode
                console.log("initApp: Triggering initial load for mode =", studyMode);
                if (studyMode === 'kanji') {
                    loadNextKanji();
                } else {
                    loadNextVocab();

            } catch (err) {
                console.error("initApp error:", err);
                promptMeaning.textContent = "Error loading application data!";
            }

            requestAnimationFrame(render);
        }

        function parseKanjiCSV(csvText) {
            const lines = csvText.split('\n');
            const database = [];
            
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                const parts = line.split('|');
                if (parts.length < 6) continue;
                
                const kanji = parts[0].trim();
                const meaning = parts[1].trim();
                const onyomi = parts[2].trim();
                const kunyomi = parts[3].trim();
                const lesson = parseInt(parts[4].trim(), 10);
                const bonus = parts[5].trim();
                
                database.push({
                    kanji,
                    meaning,
                    onyomi,
                    kunyomi,
                    lesson,
                    isBonus: parseInt(bonus, 10) === 1
                });
            }
            KANJI_DATABASE = database;

            // Load saved settings or select all by default
            userSelectedKanji = new Set(KANJI_DATABASE.map(k => k.kanji));
            if (storageAvailable) {
                const savedPrefs = localStorage.getItem('kanjiSelectionPrefs');
                if (savedPrefs) {
                    try {
                        const parsed = JSON.parse(savedPrefs);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            const existing = new Set(KANJI_DATABASE.map(k => k.kanji));
                            userSelectedKanji = new Set(parsed.filter(k => existing.has(k)));
                        }
                    } catch (e) { console.error("Failed to parse saved settings.", e); }
                }

                const savedIntervals = localStorage.getItem('kanjiIntervalsPrefs');
                if (savedIntervals) {
                    try { kanjiIntervals = JSON.parse(savedIntervals); }
                    catch (e) { console.error("Failed to parse saved intervals.", e); }
                }
                isMuted = localStorage.getItem('isMuted') === 'true';
            }
        }

        function parseVocabCSV(csvText) {
            const lines = csvText.split('\n');
            const database = [];
            
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                const parts = line.split('|');
                if (parts.length < 5) continue;
                
                const word = parts[0].trim();
                const meaning = parts[1].trim();
                const reading = parts[2].trim();
                const lesson = parseInt(parts[3].trim(), 10);
                const bonus = parts[4].trim();
                
                database.push({
                    word,
                    meaning,
                    reading,
                    lesson,
                    isBonus: parseInt(bonus, 10) === 1
                });
            }
            VOCAB_DATABASE = database;

            // Load saved intervals
            if (storageAvailable) {
                const savedIntervals = localStorage.getItem('vocabIntervalsPrefs');
                if (savedIntervals) {
                    try { vocabIntervals = JSON.parse(savedIntervals); }
                    catch (e) { console.error("Failed to parse saved vocab intervals.", e); }
                }
            }
        }

        function recalculateVocabSelection() {
            userSelectedVocab.clear();
            
            VOCAB_DATABASE.forEach(wordData => {
                const chars = Array.from(wordData.word);
                let hasActiveKanji = false;
                let allKanjiMastered = true;
                let hasAnyKanji = false;
                
                chars.forEach(char => {
                    const isKanji = /[\u4e00-\u9faf\u3400-\u4dbf\u3005\u3006]/.test(char);
                    if (isKanji) {
                        hasAnyKanji = true;
                        const kanjiData = KANJI_DATABASE.find(k => k.kanji === char);
                        if (kanjiData) {
                            if (userSelectedKanji.has(char)) {
                                hasActiveKanji = true;
                            }
                            const interval = kanjiIntervals[char] || MIN_DISTANCE;
                            if (interval < MIN_INTERVAL_FOR_VOCAB) {
                                allKanjiMastered = false;
                            }
                        } else {
                            allKanjiMastered = false;
                        }
                    }
                });
                
                // Words only containing mastered kanji (if any kanji exist in the word) 
                // and having at least one of its kanji selected in the study set are active
                if (hasAnyKanji && hasActiveKanji && allKanjiMastered) {
                    userSelectedVocab.add(wordData.word + "_" + wordData.reading);
                }
            });
        }

        async function loadNextKanji() {
            console.log("loadNextKanji: Starting, userSelectedKanji size =", userSelectedKanji.size);
            if (userSelectedKanji.size === 0) {
                promptMeaning.textContent = "No Kanji Selected";
                expectedStrokes = [];
                currentStrokeIdx = 0;
                activeStroke = [];
                completedStrokes = [];
                // Removed manual render() call
                return;
            }

            // Fallback for initial startup
            if (reviewQueue.length === 0) {
                reviewQueue = shuffleArray(Array.from(userSelectedKanji));
                console.log("loadNextKanji: Initialized reviewQueue with size =", reviewQueue.length);
            }

            const nextKanjiChar = reviewQueue.pop();
            console.log("loadNextKanji: Popped nextKanjiChar =", nextKanjiChar);
            const data = KANJI_DATABASE.find(k => k.kanji === nextKanjiChar);
            currentKanjiData = data;
            console.log("loadNextKanji: currentKanjiData =", data);

            promptMeaning.textContent = "Loading...";
            activeStroke = [];
            activeMorphs = [];
            completedStrokes = [];
            isSuccessAnimating = false;
            confettiParticles = [];
            currentStrokeIdx = 0;
            failCount = 0;
            teachMode = false;
            usedHintForKanji = false;
            teachBtn.textContent = "Teach Me";

            expectedStrokes = [];

            // Pre-initialize the target scale to the "zoomed in" bounds
            // so Teach Me has a sensible default before any user strokes
            const rect = canvas.getBoundingClientRect();
            const padding = 20;
            const targetSize = Math.min(rect.width, rect.height) - padding * 2;
            frameScale = targetSize / 109;
            frameOffsetX = (rect.width - (109 * frameScale)) / 2;
            frameOffsetY = (rect.height - (109 * frameScale)) / 2;

            try {
                if (!data) throw new Error("Could not find kanji data for " + nextKanjiChar);
                const unicodeStr = data.kanji.charCodeAt(0).toString(16).padStart(5, '0');
                const url = `svg/${unicodeStr}.svg`;
                console.log("loadNextKanji: Fetching SVG from URL =", url);

                const response = await fetch(url);
                console.log("loadNextKanji: SVG response status =", response.status);
                if (!response.ok) throw new Error("Failed to fetch SVG. Status: " + response.status);

                const svgText = await response.text();
                console.log("loadNextKanji: SVG text length =", svgText.length);
                const doc = parseSVG(svgText);

                const pathEls = doc.querySelectorAll('path');

                console.log("loadNextKanji: Found SVG paths count =", paths.length);

                const showEnglish = Math.random() > 0.5;
                const combinedReadings = [data.onyomi, data.kunyomi].filter(r => r && r.trim() !== '').join('; ');

                currentKanjiPromptHtml = promptMeaning.innerHTML;

                expectedStrokes = paths.map(path => getPointsFromSvgPath(path, NUM_POINTS));
                console.log("loadNextKanji: Populated expectedStrokes. Size =", expectedStrokes.length);

                const read = readings[i] || '';

                let borderClass = 'border-gray-300 text-transparent bg-gray-50';
                
                if (i < currentVocabCharIdx) {
                    displayChar = char;
                    borderClass = 'border-green-500 text-green-600 bg-green-50';
                } else if (i === currentVocabCharIdx) {
                    displayChar = '?';
                    borderClass = 'border-indigo-500 text-indigo-600 bg-indigo-50 ring-2 ring-indigo-300 animate-pulse';
                } else {
                    displayChar = '_';
                    borderClass = 'border-gray-200 text-transparent bg-gray-50';

            html += '</div>';
            progressText.innerHTML = html;
        }

        async function loadVocabCharStrokes() {
            const word = currentVocabData.word;
            const chars = Array.from(word);
            
            while (currentVocabCharIdx < chars.length) {
                const char = chars[currentVocabCharIdx];
                const isKanji = KANJI_DATABASE.some(k => k.kanji === char);
                
                if (isKanji) {
                    break;
                } else {
                    currentVocabCharIdx++;
                }
            }
            
            renderVocabBlanks();
            
            if (currentVocabCharIdx >= chars.length) {
                triggerVocabSuccess();
                return;
            }
            
            const kanjiChar = chars[currentVocabCharIdx];
            
            activeStroke = [];
            activeMorphs = [];
            completedStrokes = [];
            currentStrokeIdx = 0;
            failCount = 0;
            teachMode = false;
            usedHintForKanji = false;
            teachBtn.textContent = "Teach Me";
            expectedStrokes = [];
            
            const rect = canvas.getBoundingClientRect();
            const padding = 20;
            const targetSize = Math.min(rect.width, rect.height) - padding * 2;
            frameScale = targetSize / 109;
            frameOffsetX = (rect.width - (109 * frameScale)) / 2;
            frameOffsetY = (rect.height - (109 * frameScale)) / 2;

            try {
                const unicodeStr = kanjiChar.charCodeAt(0).toString(16).padStart(5, '0');
                const url = `svg/${unicodeStr}.svg`;

                const response = await fetch(url);
                if (!response.ok) throw new Error("Failed to fetch SVG");

                const svgText = await response.text();
                const doc = parseSVG(svgText);

                const pathEls = doc.querySelectorAll('path');
                const paths = Array.from(pathEls).map(el => el.getAttribute('d'));

                expectedStrokes = paths.map(path => getPointsFromSvgPath(path, NUM_POINTS));
            } catch (err) {
                console.error(err);
                showMessage("Error loading character strokes!");
            }
        }

        function triggerVocabSuccess() {
            isSuccessAnimating = true;
            successStartTime = performance.now();
            
            const rect = canvas.getBoundingClientRect();
            const padding = 20;
            const targetSize = Math.min(rect.width, rect.height) - padding * 2;
            finalScale = targetSize / 109;
            finalOffsetX = (rect.width - (109 * finalScale)) / 2;
            finalOffsetY = (rect.height - (109 * finalScale)) / 2;

            if (vocabWordPassed) {
                playPartyPopper();
                
                // Burst confetti from the expected strokes of the completed word
                confettiParticles = [];
                const colors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];
                expectedStrokes.forEach(stroke => {
                    const projected = stroke.map(p => ({
                        x: p.x * frameScale + frameOffsetX,
                        y: p.y * frameScale + frameOffsetY
                    }));
                    for (let i = 0; i < projected.length; i += 4) {
                        confettiParticles.push({
                            x: projected[i].x,
                            y: projected[i].y,
                            vx: (Math.random() - 0.5) * 16,
                            vy: (Math.random() - 0.5) * 16 - 3,
                            color: colors[Math.floor(Math.random() * colors.length)],
                            size: Math.random() * 6 + 4,
                            life: 1.0,
                            decay: Math.random() * 0.003 + 0.001
                        });
                    }
                });
            } else {
                confettiParticles = [];
            }
            
            recordVocabResult(currentVocabData.word + "_" + currentVocabData.reading, vocabWordPassed);
            
            const rubyHtml = buildRubyHtml(currentVocabData.word, currentVocabData.reading);
            promptMeaning.innerHTML = `
                <div class="flex flex-col items-center">
                    <span class="text-emerald-600 font-extrabold text-3xl pb-2">${rubyHtml}</span>
                    <span class="text-sm text-gray-500 font-medium">${currentVocabData.meaning}</span>
                </div>
            `;
            currentVocabPromptHtml = promptMeaning.innerHTML;
            
            if (vocabReviewMode === 'en_to_ja') {
                promptMeaning.classList.add('opacity-0');
                const overlay = document.getElementById('vocab-canvas-overlay');
                const wordEl = document.getElementById('vocab-overlay-word');
                const meaningEl = document.getElementById('vocab-overlay-meaning');
                if (overlay && wordEl && meaningEl) {
                    wordEl.innerHTML = rubyHtml;
                    meaningEl.textContent = currentVocabData.meaning;
                    overlay.classList.remove('opacity-0');
                    overlay.classList.add('opacity-100');
                }
            }

            teachBtn.textContent = "Show Info";
            renderVocabBlanks();
        }

        function recordVocabResult(vocabKey, passed) {
            if (!vocabIntervals[vocabKey]) {
                vocabIntervals[vocabKey] = MIN_DISTANCE;
            }

            if (!passed) {
                vocabIntervals[vocabKey] = Math.max(MIN_DISTANCE, Math.floor(vocabIntervals[vocabKey] * 0.3));
            } else {
                vocabIntervals[vocabKey] = Math.floor(vocabIntervals[vocabKey] * 2.0);
            }

            if (storageAvailable) {
                localStorage.setItem('vocabIntervalsPrefs', JSON.stringify(vocabIntervals));
            }

            // Splice it back into the queue based on its new interval
            if (userSelectedVocab.has(vocabKey)) {
                let insertDist = vocabIntervals[vocabKey];
                // Remove from current queue if present
                const qi = vocabReviewQueue.indexOf(vocabKey);
                if (qi !== -1) {
                    vocabReviewQueue.splice(qi, 1);
                }
                
                if (insertDist >= vocabReviewQueue.length) {
                    vocabReviewQueue.unshift(vocabKey); // Front of queue (next up)
                } else {
                    // Splice it insertDist elements from the end (since we pop from the end)
                    vocabReviewQueue.splice(vocabReviewQueue.length - insertDist, 0, vocabKey);
                }
            }
        }

        function checkVocabAnswer() {
            const vocabInput = document.getElementById('vocab-input');
            const vocabCheckBtn = document.getElementById('vocab-check-btn');
            
            if (vocabCheckBtn.textContent === 'Next') {
                loadNextVocab();
                return;
            }

            const userInput = vocabInput.value;
            
            function cleanText(text) {
                return text.toLowerCase()
                           .replace(/\([^)]*\)/g, '')
                           .replace(/\b(to|a|an|the)\b/g, '')
                           .replace(/-/g, ' ')
                           .replace(/[.,\/#!$%\^&\*;:{}=_`~()?"']/g, "")
                           .replace(/\b([a-z])\s+(?=[a-z]\b)/g, '$1')
                           .replace(/\s+/g, " ")
                           .trim();
            }

            const cleanUser = cleanText(userInput);
            const meanings = currentVocabData.meaning.split(';').map(m => cleanText(m));
            const isCorrect = meanings.some(m => m === cleanUser);

            if (isCorrect || cleanUser === cleanText(currentVocabData.meaning)) {
                vocabInput.value = currentVocabData.meaning;
                vocabInput.readOnly = true;
                vocabInput.classList.remove('border-red-500', 'bg-red-50');
                vocabInput.classList.add('border-green-500', 'bg-green-50');
                
                const rts = promptMeaning.querySelectorAll('.rt-furigana');
                rts.forEach(rt => rt.classList.remove('opacity-0'));

                playPartyPopper();
                
                // Type success: burst confetti from bottom center of the canvas area
                confettiParticles = [];
                const colors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];
                const rect = canvas.getBoundingClientRect();
                const startX = rect.width / 2;
                const startY = rect.height;
                for (let i = 0; i < 60; i++) {
                    confettiParticles.push({
                        x: startX,
                        y: startY,
                        vx: (Math.random() - 0.5) * 14,
                        vy: -Math.random() * 12 - 4,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        size: Math.random() * 5 + 3,
                        life: 1.0,
                        decay: Math.random() * 0.005 + 0.002
                    });
                }
                
                recordVocabResult(currentVocabData.word + "_" + currentVocabData.reading, failCount < 3);

                vocabCheckBtn.textContent = 'Next';
                vocabCheckBtn.className = "mt-4 w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-xl transition-all shadow-md focus:outline-none cursor-pointer";
                
                teachBtn.classList.remove('hidden');
                teachBtn.textContent = 'Show Info';
            } else {
                vocabInput.classList.add('animate-shake', 'border-red-500', 'bg-red-50');
                setTimeout(() => vocabInput.classList.remove('animate-shake'), 500);

                failCount++;
                playErrorBeep();

                if (failCount >= 3) {
                    vocabInput.value = currentVocabData.meaning;
                    vocabInput.readOnly = true;

                    // Show furigana
                    const rts = promptMeaning.querySelectorAll('.rt-furigana');
                    rts.forEach(rt => rt.classList.remove('opacity-0'));

                    // Record failure in SRS
                    recordVocabResult(currentVocabData.word + "_" + currentVocabData.reading, false);

                    vocabCheckBtn.textContent = 'Next';
                    vocabCheckBtn.className = "mt-4 w-full bg-slate-600 hover:bg-slate-700 text-white font-bold py-3 px-6 rounded-xl transition-all shadow-md focus:outline-none cursor-pointer";
                    
                    teachBtn.classList.remove('hidden');
                    teachBtn.textContent = 'Show Info';
                } else {
